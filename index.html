<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deutschtest</title>
<link rel="stylesheet" href="style.css">
<script data-goatcounter="https://aguitoo.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</head>
<body>
<header class="top">
  <div class="brand">Deutschtest <small id="brandSub"></small></div>
  <div class="grow"></div>
  <span id="timer" class="pill" hidden></span>
  <span id="codePill" class="pill" hidden></span>
</header>
<main class="wrap" id="app"><p class="muted">Wird geladen …</p></main>
<div class="footer" id="footer" hidden><div class="in" id="footerIn"></div></div>

<script type="module">
import { DB, DEMO } from './db.js';
import { esc, fmt, optionsFor, label, grade, makeCode, answerText, itemsOf } from './engine.js';

const $ = s => document.querySelector(s);
const app = $('#app');
const params = new URLSearchParams(location.search);
const TID = params.get('t');
const PREVIEW = params.get('preview') === '1';

let test = null, content = null, state = null, timerH = null;
const SKEY = id => 'dt_state_' + id + (PREVIEW ? '_preview' : '');
const save = () => { try { localStorage.setItem(SKEY(test.id), JSON.stringify(state)); } catch { } };
const loadState = id => { try { return JSON.parse(localStorage.getItem(SKEY(id))); } catch { return null; } };
const clearState = id => { try { localStorage.removeItem(SKEY(id)); } catch { } };
const banner = () => (DEMO ? `<div class="banner"><b>Demo-Modus:</b> Firebase ist noch nicht eingerichtet – alles wird nur in diesem Browser gespeichert.</div>` : '')
  + (PREVIEW ? `<div class="banner"><b>Vorschau für den Testmacher:</b> Es wird nichts abgegeben. Am Ende siehst du die Auswertung mit Lösungen.</div>` : '');

// ---------- Start ----------
init();
async function init() {
  if (!TID) return showList();
  test = await DB.getTest(TID);
  if (!test) return fail('Dieser Test existiert nicht oder ist noch nicht freigegeben.');
  if (PREVIEW && !(await DB.isAdmin())) return fail('Die Vorschau ist nur für den Testmacher (in der Konsole angemeldet).');
  if (!PREVIEW && test.status !== 'open') return fail(test.status === 'closed'
    ? 'Dieser Test ist geschlossen. <a href="uebersicht.html?t=' + esc(TID) + '">Zur Ergebnisübersicht</a>' : 'Dieser Test ist noch nicht geöffnet.');
  content = JSON.parse(test.content);
  content.sections = content.sections.filter(s => (s.parts || []).some(p => (p.items || []).length));
  document.title = test.title;
  $('#brandSub').textContent = test.level || '';
  state = loadState(TID);
  if (state && state.secIdx != null) return runSection();
  showStart();
}
function fail(msg) { app.innerHTML = banner() + `<div class="card"><h2>Hinweis</h2><p>${msg}</p><p><a href="./">Zur Testauswahl</a></p></div>`; }

async function showList() {
  const list = (await DB.listTests(['open'])).sort((a, b) => (a.title || '').localeCompare(b.title || ''));
  app.innerHTML = banner() + `<h1>Testauswahl</h1><p class="muted">Wähle den Test, den deine Lehrkraft angegeben hat.</p>` +
    (list.length ? list.map(t => `<div class="card"><div class="row" style="justify-content:space-between">
      <div><h2 style="margin:0">${esc(t.title)}</h2><div class="muted">${esc(t.level || '')} · ${t.itemCount || 0} Aufgaben</div></div>
      <a class="btn" href="?t=${encodeURIComponent(t.id)}">Öffnen</a></div></div>`).join('')
      : `<div class="card"><p>Im Moment ist kein Test geöffnet.</p></div>`) +
    `<p class="small"><a href="uebersicht.html">Ergebnisübersichten ansehen</a></p>`;
}

function showStart() {
  const secs = content.sections.map(s => {
    const n = s.parts.reduce((a, p) => a + (p.items || []).length, 0);
    const hasAudio = s.parts.some(p => p.audio);
    return `<li><b>${esc(s.title)}</b> – ${n} Aufgaben${s.timeMin ? ` · ${s.timeMin} Min.` : ''}${hasAudio ? ' · 🎧 Kopfhörer bereithalten' : ''}</li>`;
  }).join('');
  const hasAudio = content.sections.some(s => s.parts.some(p => p.audio));
  app.innerHTML = banner() + `<div class="card">
    <h1>${esc(test.title)}</h1>${test.description ? `<p>${fmt(test.description)}</p>` : ''}
    <h3 style="margin-top:14px">Ablauf</h3><ol>${secs}</ol>
    <ul class="muted small">
      <li>Die Abschnitte kommen nacheinander. Wenn du einen Abschnitt abschließt, kannst du <b>nicht zurück</b>.</li>
      ${hasAudio ? '<li>Die Hörtexte kannst du nur so oft abspielen, wie angegeben.</li>' : ''}
      <li>Deine Antworten werden automatisch gespeichert – auch wenn die Seite neu lädt.</li>
      <li>Nach der Abgabe bekommst du einen <b>persönlichen Code</b>. Damit findest du später dein Ergebnis – anonym.</li>
    </ul>
    ${test.askName && !PREVIEW ? `<label class="field"><span>Dein Name</span><input type="text" id="name" maxlength="60" autocomplete="name"></label>` : ''}
    <div id="startErr"></div>
    <button class="btn teal" id="go" style="margin-top:8px">Test beginnen</button></div>`;
  $('#go').onclick = async () => {
    const name = $('#name') ? $('#name').value.trim() : '';
    if (test.askName && !PREVIEW && !name) { $('#startErr').innerHTML = '<p class="err">Bitte gib deinen Namen ein.</p>'; return; }
    $('#go').disabled = true;
    try { if (!PREVIEW) await DB.ensureStudent(); }
    catch (e) { $('#startErr').innerHTML = `<p class="err">Verbindung fehlgeschlagen: ${esc(e.message)}</p>`; $('#go').disabled = false; return; }
    state = { testId: test.id, code: makeCode(), name, answers: {}, plays: {}, secIdx: 0, startedAt: Date.now(), deadline: null };
    startSection(0);
  };
}

// ---------- Abschnitte ----------
function startSection(i) {
  state.secIdx = i;
  const s = content.sections[i];
  state.deadline = s.timeMin ? Date.now() + s.timeMin * 60000 : null;
  save(); runSection(); scrollTo(0, 0);
}

function runSection() {
  const i = state.secIdx, s = content.sections[i];
  $('#codePill').hidden = PREVIEW; $('#codePill').textContent = 'Code ' + state.code;
  const steps = content.sections.map((x, j) => `<div class="step ${j < i ? 'done' : j === i ? 'now' : ''}"><b>Teil ${j + 1}</b>${esc(x.title)}</div>`).join('');
  app.innerHTML = banner() + `<div class="steps">${steps}</div>
    <h1>${esc(s.title)}</h1>${s.instructions ? `<p class="muted">${fmt(s.instructions)}</p>` : ''}
    <div id="parts"></div>`;
  const box = $('#parts');
  s.parts.forEach(p => box.appendChild(renderPart(p)));
  box.addEventListener('change', onAnswer); box.addEventListener('input', onAnswer);
  $('#footer').hidden = false;
  updateFooter(); startTimer();
}

function onAnswer(e) {
  const el = e.target, gid = el.dataset.gid; if (!gid) return;
  if (el.type === 'radio') {
    state.answers[gid] = el.value;
    el.closest('.opts').querySelectorAll('.opt').forEach(o => o.classList.toggle('sel', o.querySelector('input').checked));
  } else {
    const v = el.value; if (v === '') delete state.answers[gid]; else state.answers[gid] = v;
    el.classList.toggle('filled', v !== '');
  }
  save(); updateBankMarks(); updateFooter();
}

function updateBankMarks() {
  document.querySelectorAll('.bank[data-part]').forEach(b => {
    const pid = b.dataset.part;
    const used = new Set(Object.entries(state.answers).filter(([g]) => g.startsWith(pid + '.')).map(([, v]) => v));
    b.querySelectorAll('span[data-k]').forEach(sp => sp.classList.toggle('used', used.has(sp.dataset.k)));
  });
}

function sectionCounts() {
  const s = content.sections[state.secIdx]; let n = 0, a = 0;
  s.parts.forEach(p => (p.items || []).forEach(it => { n++; if (state.answers[p.id + '.' + it.id] != null) a++; }));
  return { n, a };
}

function updateFooter() {
  const { n, a } = sectionCounts(), last = state.secIdx === content.sections.length - 1;
  $('#footerIn').innerHTML = `<span><b>${a}</b> von ${n} beantwortet</span>
    <button class="btn ${last ? 'teal' : ''}" id="next">${last ? (PREVIEW ? 'Vorschau auswerten' : 'Test abgeben') : 'Weiter: ' + esc(content.sections[state.secIdx + 1].title) + ' →'}</button>`;
  $('#next').onclick = () => next(false);
}

function next(forced) {
  const { n, a } = sectionCounts(), last = state.secIdx === content.sections.length - 1;
  if (!forced) {
    const miss = n - a;
    const msg = (miss ? `Du hast ${miss} Aufgabe${miss > 1 ? 'n' : ''} nicht beantwortet.\n` : '') +
      (last ? 'Möchtest du den Test jetzt abgeben?' : 'Abschnitt abschließen? Du kannst danach nicht mehr zurück.');
    if (!confirm(msg)) return;
  }
  stopAudio();
  if (last) return finish();
  startSection(state.secIdx + 1);
}

function startTimer() {
  clearInterval(timerH);
  const el = $('#timer');
  if (!state.deadline) { el.hidden = true; return; }
  el.hidden = false;
  const tick = () => {
    const left = Math.max(0, Math.round((state.deadline - Date.now()) / 1000));
    el.textContent = '⏱ ' + Math.floor(left / 60) + ':' + String(left % 60).padStart(2, '0');
    el.classList.toggle('warn', left <= 60);
    if (left <= 0) { clearInterval(timerH); alert('Die Zeit für diesen Abschnitt ist abgelaufen.'); next(true); }
  };
  tick(); timerH = setInterval(tick, 1000);
}

// ---------- Darstellung eines Aufgabenteils ----------
function renderPart(p) {
  const el = document.createElement('section'); el.className = 'part';
  const items = p.items || [];
  const gapIds = new Set([...String(p.text || '').matchAll(/\[\[([^\]]+)\]\]/g)].map(m => m[1]));
  let h = `<div class="part-head"><h3>${esc(p.title || '')}</h3>${p.instructions ? `<p class="instr">${fmt(p.instructions)}</p>` : ''}</div><div class="part-body">`;
  if (p.audio) h += `<div class="audio" data-audio="${esc(p.id)}"></div>`;
  if (p.image) h += `<img class="pimg" src="${esc(p.image)}" alt="">`;
  if (p.bank && !p.bankHidden) h += `<div class="bank" data-part="${esc(p.id)}">${p.bank.map(o => `<span data-k="${esc(o.k)}"><b>${esc(o.k)}</b>${esc(o.t)}</span>`).join('')}</div>`;
  if (p.text) {
    const byId = Object.fromEntries(items.map(it => [it.id, it]));
    const html = String(p.text).split(/\n{2,}/).map(par => {
      const chunks = par.split(/(\[\[[^\]]+\]\])/g).map(c => {
        const m = c.match(/^\[\[([^\]]+)\]\]$/);
        if (!m) return fmt(c).replace(/\n/g, '<br>');
        const it = byId[m[1]]; return it ? gapControl(p, it) : esc(c);
      });
      return '<p>' + chunks.join('') + '</p>';
    }).join('');
    h += `<div class="text">${html}</div>`;
    const choiceGaps = items.filter(it => gapIds.has(it.id) && it.type === 'choice');
    const longOpts = p.showOptions ?? choiceGaps.some(it => it.options.some(o => o.t.length > 22));
    if (choiceGaps.length && longOpts) h += `<div class="optlist">${choiceGaps.map(it => `<div class="optgroup"><div class="ohead">${esc(label(it))}</div>
      ${it.options.map(o => `<div class="oline"><b>${esc(o.k)}</b><span>${esc(o.t)}</span></div>`).join('')}</div>`).join('')}</div>`;
  }
  const qs = items.filter(it => !gapIds.has(it.id));
  if (qs.length) h += `<div style="margin-top:${p.text ? 18 : 0}px">${qs.map(it => question(p, it)).join('')}</div>`;
  el.innerHTML = h + '</div>';
  if (p.audio) setupAudio(el.querySelector('.audio'), p);
  el.querySelectorAll('[data-ord]').forEach(q => setupOrder(q, p, items.find(it => p.id + '.' + it.id === q.dataset.ord)));
  setTimeout(updateBankMarks);
  return el;
}

function gapControl(p, it) {
  const gid = p.id + '.' + it.id, v = state.answers[gid];
  if (it.type === 'input') return `<span class="gapwrap"><span class="gapno">${esc(label(it))}</span><input class="gapin ${v ? 'filled' : ''}" data-gid="${esc(gid)}" value="${esc(v || '')}" autocomplete="off" autocapitalize="off" spellcheck="false"></span>`;
  const opts = optionsFor(p, it).map(o => `<option value="${esc(o.k)}" ${v === o.k ? 'selected' : ''}>${p.bankHidden && it.type === 'bank' ? esc(o.t) : esc(o.k) + (it.type === 'bank' ? '  ' : ') ') + esc(o.t)}</option>`).join('');
  return `<span class="gapwrap"><span class="gapno">${esc(label(it))}</span><select class="gap ${v ? 'filled' : ''}" data-gid="${esc(gid)}" aria-label="Lücke ${esc(label(it))}"><option value="">…</option>${opts}</select></span>`;
}

function question(p, it) {
  const gid = p.id + '.' + it.id, v = state.answers[gid];
  const head = `<div class="qhead"><span class="gapno">${esc(label(it))}</span><span>${fmt(it.prompt || '')}</span></div>`;
  if (it.type === 'order') return `<div class="q ord" data-ord="${esc(gid)}">${head}<div class="sent"></div><div class="pool"></div></div>`;
  if (it.type === 'input') return `<div class="q">${head}<input type="text" class="gapin ${v ? 'filled' : ''}" style="width:100%" data-gid="${esc(gid)}" value="${esc(v || '')}" autocomplete="off"></div>`;
  if (it.type === 'bank') return `<div class="q">${head}<select class="gap ${v ? 'filled' : ''}" data-gid="${esc(gid)}"><option value="">…</option>${p.bank.map(o => `<option value="${esc(o.k)}" ${v === o.k ? 'selected' : ''}>${esc(o.k)}  ${esc(o.t)}</option>`).join('')}</select></div>`;
  const opts = optionsFor(p, it).map(o => `<label class="opt ${v === o.k ? 'sel' : ''}"><input type="radio" name="${esc(gid)}" data-gid="${esc(gid)}" value="${esc(o.k)}" ${v === o.k ? 'checked' : ''}>${it.type === 'truefalse' ? '' : `<span class="k">${esc(o.k)}</span>`}<span>${esc(o.t)}</span></label>`).join('');
  return `<div class="q ${it.type === 'truefalse' ? 'tf' : ''}">${head}<div class="opts">${opts}</div></div>`;
}

// ---------- Satzbau: Bausteine antippen ----------
function setupOrder(q, p, it) {
  const gid = p.id + '.' + it.id;
  state.order = state.order || {};
  const draw = () => {
    const seq = state.order[gid] || [];
    q.querySelector('.sent').innerHTML = (it.prefix ? `<span class="fix">${esc(it.prefix)}</span>` : '') +
      (seq.length ? seq.map((ti, pos) => `<button type="button" class="tok in" data-pos="${pos}">${esc(it.tokens[ti])}</button>`).join('') : '<span class="ph">Bausteine antippen …</span>') +
      (it.suffix ? `<span class="fix">${esc(it.suffix)}</span>` : '');
    q.querySelector('.pool').innerHTML = it.tokens.map((t, ti) => seq.includes(ti) ? '' : `<button type="button" class="tok" data-ti="${ti}">${esc(t)}</button>`).join('') +
      (seq.length ? `<button type="button" class="tok reset" data-reset="1">↺ zurücksetzen</button>` : '');
    q.classList.toggle('complete', seq.length === it.tokens.length);
  };
  q.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    const seq = state.order[gid] = state.order[gid] || [];
    if (b.dataset.reset) seq.length = 0;
    else if (b.dataset.pos != null) seq.splice(+b.dataset.pos, 1);
    else if (b.dataset.ti != null) seq.push(+b.dataset.ti);
    if (seq.length) state.answers[gid] = seq.map(i => it.tokens[i]).join(' '); else delete state.answers[gid];
    save(); draw(); updateFooter();
  });
  draw();
}

// ---------- Hören: begrenzte Wiedergabe, kein Spulen ----------
let current = null;
function stopAudio() { if (current) { current.pause(); current = null; } }
function setupAudio(box, p) {
  const max = p.audio.maxPlays ?? 2;
  const audio = new Audio(p.audio.src); audio.preload = 'auto';
  const draw = () => {
    const used = state.plays[p.id] || 0, left = max - used, playing = current === audio && !audio.paused;
    box.innerHTML = `<button class="btn teal sm" ${left <= 0 || playing ? 'disabled' : ''}>${playing ? '🔊 läuft …' : '▶ Abspielen'}</button>
      <div class="bar"><i></i></div><span class="left">${left > 0 ? `noch ${left}× abspielbar` : 'nicht mehr abspielbar'}</span>`;
    box.querySelector('button').onclick = () => {
      if ((state.plays[p.id] || 0) >= max) return;
      stopAudio(); state.plays[p.id] = (state.plays[p.id] || 0) + 1; save();
      current = audio; audio.currentTime = 0;
      audio.play().catch(() => { alert('Audio konnte nicht abgespielt werden.'); state.plays[p.id]--; save(); draw(); });
      draw();
    };
  };
  audio.addEventListener('timeupdate', () => { const i = box.querySelector('.bar i'); if (i && audio.duration) i.style.width = (100 * audio.currentTime / audio.duration) + '%'; });
  audio.addEventListener('ended', () => { current = null; draw(); });
  draw();
}

// ---------- Abgabe ----------
async function finish() {
  clearInterval(timerH); $('#timer').hidden = true; $('#footer').hidden = true;
  if (PREVIEW) return previewResult();
  app.innerHTML = `<div class="card"><h2>Wird abgegeben …</h2></div>`;
  const data = {
    code: state.code, name: state.name || '', answers: JSON.stringify(state.answers),
    startedAt: state.startedAt, durationSec: Math.round((Date.now() - state.startedAt) / 1000),
  };
  try {
    await DB.submit(test.id, data);
    clearState(test.id); await DB.endStudent().catch(() => { });
    const code = state.code;
    $('#codePill').hidden = true;
    app.innerHTML = `<div class="card" style="text-align:center">
      <h1>Vielen Dank!</h1><p>Dein Test ist abgegeben.</p>
      <p style="margin-top:18px">Dein persönlicher Code:</p><div class="code">${esc(code)}</div>
      <p class="muted" style="margin-top:12px">Schreib dir den Code auf oder mach ein Foto.<br>Damit siehst du dein Ergebnis, sobald es freigegeben ist.</p>
      <p><a class="btn ghost" href="uebersicht.html?t=${encodeURIComponent(test.id)}">Zur Ergebnisübersicht</a></p></div>`;
  } catch (e) {
    app.innerHTML = `<div class="card"><h2>Abgabe fehlgeschlagen</h2><p class="err">${esc(e.message || e)}</p>
      <p>Deine Antworten sind gespeichert. Prüfe die Internetverbindung und versuche es noch einmal.</p>
      <p class="muted">Dein Code: <b>${esc(state.code)}</b></p><button class="btn" id="retry">Erneut abgeben</button></div>`;
    $('#retry').onclick = finish;
  }
}

async function previewResult() {
  const key = await DB.getKey(test.id);
  const full = JSON.parse(test.content);
  const g = grade(full, key, state.answers);
  const rows = itemsOf(full).map(({ gid, s, p, it }) => {
    const r = g.items[gid];
    return `<tr><td>${esc(s.title)}</td><td>${esc(p.title || p.id)}</td><td>${esc(label(it))}</td>
      <td>${esc(answerText(p, it, r.given))}</td><td>${esc(answerText(p, it, key[gid]))}</td><td>${r.ok ? '<span class="good">✓</span>' : '<span class="badv">✗</span>'}</td></tr>`;
  }).join('');
  clearState(test.id);
  app.innerHTML = banner() + `<div class="card"><h1>Vorschau-Auswertung</h1>
    <p><b>${g.pts} / ${g.max} Punkte (${g.pct} %)</b></p>
    ${g.sections.map(s => `<div class="hbar"><span>${esc(s.title)}</span><div class="t"><i style="width:${s.pct}%"></i></div><span class="n">${s.pts}/${s.max}</span></div>`).join('')}
    </div><div class="card tscroll"><table class="tbl"><thead><tr><th>Abschnitt</th><th>Teil</th><th>Nr.</th><th>Gegeben</th><th>Lösung</th><th></th></tr></thead><tbody>${rows}</tbody></table>
    <p style="margin-top:14px"><a class="btn" href="?t=${encodeURIComponent(test.id)}&preview=1">Vorschau neu starten</a></p></div>`;
}
</script>
</body>
</html>
